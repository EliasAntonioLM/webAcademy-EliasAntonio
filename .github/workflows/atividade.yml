
name: Atividade Primeiro Workflow

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Iniciar o Workflow
        run: echo "Iniciando o Workflow"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Exibir nome do repositorio e usuario
        run: |
          echo "repositorio: ${{ github.repository }}"
          echo "usuario: ${{ github.actor }}"

      - name: Teste 'existe README.md'
        run: test -f README.md

      - name: Concluir validação
        run: echo "Validação concluída"
